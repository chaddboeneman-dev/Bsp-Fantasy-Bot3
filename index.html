<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#08141d'><title>BSP Fantasy Bot</title><link rel='manifest' href='manifest.webmanifest'><style>
:root{--lion:#0076b6;--silver:#b0b7bc;--eagle:#004c54;--green:#19a77a;--bg:#071018;--panel:#0d1a24;--text:#f5f8fa;--muted:#9db0bd;--gold:#f2c35d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(115deg,#00263d 0 49%,#08221d 51% 100%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:14px}.hero{text-align:center;padding:24px 12px}.hero small{color:var(--gold);font-weight:900;letter-spacing:.14em}.hero h1{font-size:clamp(36px,9vw,70px);line-height:.9;margin:8px 0}.lion{color:#9fd8ff}.eagle{color:#baffdf}.hero p{color:var(--muted);font-weight:700}header{position:sticky;top:0;background:#071018ee;backdrop-filter:blur(10px);border-bottom:1px solid #29404f;z-index:4}.bar{display:flex;gap:8px}.bar select{flex:1}.control,select,input,button{font:inherit}.control,select,input{background:#0b1720;color:white;border:1px solid #29404f;border-radius:10px;padding:10px}.btn{border:0;border-radius:10px;padding:10px 13px;color:white;background:linear-gradient(135deg,var(--lion),#159fe8);font-weight:900}.btn.green{background:linear-gradient(135deg,var(--eagle),var(--green))}.tabs{display:flex;overflow:auto;gap:7px;padding-top:10px}.tab{white-space:nowrap;background:#101e28;border:1px solid #29404f;color:#dce8ee;padding:8px 11px;border-radius:999px;font-weight:800}.tab.on{background:linear-gradient(90deg,var(--lion),var(--eagle))}.view{display:none}.view.on{display:block}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{grid-column:span 4;background:#0b1720ee;border:1px solid #29404f;border-radius:16px;padding:14px;box-shadow:0 14px 36px #0005}.wide{grid-column:span 8}.full{grid-column:1/-1}.edgeL{border-left:4px solid var(--lion)}.edgeE{border-left:4px solid var(--green)}h2,h3{margin:3px 0 10px}.tag{font-size:10px;color:var(--gold);font-weight:900;letter-spacing:.1em}.muted{color:var(--muted)}.metric{font-size:40px;font-weight:1000}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #213540}.row:first-child{border:0}.pill{font-size:11px;font-weight:900;border:1px solid #35505f;background:#172833;padding:4px 8px;border-radius:999px}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tool{background:#10212c;border:1px solid #29404f;border-radius:12px;padding:15px;text-align:center;font-weight:900}.notice{background:#09151dcc;border:1px dashed #3d5968;border-radius:11px;padding:11px;color:#bdd0db}.form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px}.team{margin-top:10px;background:#09141d;border:1px solid #20333f;border-radius:12px;padding:11px}.footer{text-align:center;color:#718795;font-size:11px;padding:35px 0}.good{color:#55e4aa}.warn{color:#ffd17a}@media(max-width:720px){.card,.wide{grid-column:1/-1}.tools{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr 1fr}.form .wideinput{grid-column:1/-1}.form button{grid-column:1/-1}.hero{padding:17px 8px}.hero h1{font-size:40px}}
</style></head><body><div class='hero'><small>DETROIT GRIT × PHILLY MENTALITY</small><h1><span class='lion'>BSP</span> FANTASY <span class='eagle'>BOT</span></h1><p>4 Leagues • BigShow + Billy • Bounty Hunters</p></div><header><div class='wrap'><div class='bar'><select id='league' onchange='switchLeague(this.value)'></select><button class='btn' onclick="show('setup')">ESPN Setup</button></div><div class='tabs' id='tabs'></div></div></header><main class='wrap'><section id='home' class='view on'></section><section id='roster' class='view'></section><section id='startsit' class='view'></section><section id='waivers' class='view'></section><section id='trade' class='view'></section><section id='rankings' class='view'></section><section id='dst' class='view'></section><section id='setup' class='view'></section><section id='share' class='view'></section><div class='footer'>BSP FANTASY BOT • FREE MOBILE BUILD</div></main><script>
const tabs=[['home','Home'],['roster','Roster'],['startsit','Start/Sit'],['waivers','Waivers'],['trade','Trade Bot'],['rankings','Rankings'],['dst','D/ST'],['share','Share']];const seed=[['Jayden Daniels','QB','START',94,97],['James Cook','RB','START',91,94],['Kenneth Walker III','RB','START',88,93],['DeVonta Smith','WR','START',89,92],['Jameson Williams','WR','START',84,92],['Juwan Johnson','TE','START',69,76],['Zay Flowers','WR','FLEX',90,94],['Jayden Reed','WR','FLEX',82,89],['49ers','D/ST','START',80,84],['Jonathon Brooks','RB','BENCH',73,90],['Pat Bryant','WR','BENCH',68,82],['J.K. Dobbins','RB','BENCH',78,84],['Jared Goff','QB','BENCH',83,86],['Elijah Johnson','RB','BENCH',55,70],['Michael Mayer','TE','BENCH',58,72],['Antonio Williams','WR','BENCH',59,76]].map(x=>({name:x[0],pos:x[1],slot:x[2],ros:x[3],up:x[4]}));let db=JSON.parse(localStorage.getItem('bsp-fantasy-bot3')||'null')||{active:0,leagues:[{name:'Bounty Hunters',espnId:'',season:2026,myTeam:'Bounty Hunters',owners:'BigShow + Billy',teams:[{name:'Bounty Hunters',players:seed}]},{name:'League 2',espnId:'',season:2026,myTeam:'',owners:'BigShow',teams:[]},{name:'League 3',espnId:'',season:2026,myTeam:'',owners:'BigShow',teams:[]},{name:'League 4',espnId:'',season:2026,myTeam:'',owners:'BigShow',teams:[]}]};const $=x=>document.getElementById(x),L=()=>db.leagues[db.active],M=()=>L().teams.find(t=>t.name===L().myTeam)||L().teams[0],esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('bsp-fantasy-bot3',JSON.stringify(db));render()}function show(id,b){document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('.tab').forEach(v=>v.classList.remove('on'));(b||document.querySelector(`[data-id="${id}"]`))?.classList.add('on')}function switchLeague(i){db.active=+i;save()}function score(t){return t?.players?.length?Math.round(t.players.reduce((a,p)=>a+(+p.ros||50),0)/t.players.length):0}function initTabs(){$('tabs').innerHTML=tabs.map((t,i)=>`<button class='tab ${i?'':'on'}' data-id='${t[0]}' onclick="show('${t[0]}',this)">${t[1]}</button>`).join('')}function home(){let m=M(),s=score(m),weak=(m?.players||[]).slice().sort((a,b)=>a.ros-b.ros)[0];$('home').innerHTML=`<div class='grid'><div class='card edgeL'><div class='tag'>ACTIVE LEAGUE</div><h2>${esc(L().name)}</h2><div class='muted'>${esc(L().owners)}</div></div><div class='card'><div class='tag'>ROSTER GRADE</div><div class='metric'>${s||'—'}</div></div><div class='card edgeE'><div class='tag'>TOP NEED</div><h2>${weak?esc(weak.pos):'Load League'}</h2><div class='muted'>${weak?esc(weak.name)+' • ROS '+weak.ros:'Add ESPN data'}</div></div><div class='card wide'><h3>Bounty Hunters Command Center</h3><div class='tools'>${tabs.slice(1,7).map(t=>`<div class='tool' onclick="show('${t[0]}')">${t[1]}</div>`).join('')}</div></div><div class='card'><div class='tag'>ESPN</div><h3>${L().espnId?'League ID Saved':'Not Connected'}</h3><span class='${L().espnId?'good':'warn'}'>${L().espnId?esc(L().espnId):'Open ESPN Setup'}</span></div><div class='card full'><h3>League Power Board</h3>${L().teams.length?L().teams.slice().sort((a,b)=>score(b)-score(a)).map((t,i)=>`<div class='row'><b>${i+1}. ${esc(t.name)}</b><span class='pill'>${score(t)}</span></div>`).join(''):`<div class='notice'>Load league rosters to activate this board.</div>`}</div></div>`}function roster(){let m=M();$('roster').innerHTML=`<div class='card full'><h3>${esc(m?.name||'Your Team')} Roster</h3>${(m?.players||[]).map(p=>`<div class='row'><div><b>${esc(p.name)}</b><div class='muted'>${esc(p.pos)} • ${esc(p.slot)}</div></div><div><span class='pill'>ROS ${p.ros}</span> <span class='pill'>UP ${p.up}</span></div></div>`).join('')||'<div class="notice">No roster loaded.</div>'}</div>`}function startsit(){let ps=(M()?.players||[]).slice().sort((a,b)=>(b.ros*.65+b.up*.35)-(a.ros*.65+a.up*.35));$('startsit').innerHTML=`<div class='card full'><h3>Start / Sit Board</h3><div class='notice'>BSP score blends editable ROS and upside ratings. It is not a paid live projection feed.</div>${ps.map((p,i)=>`<div class='row'><div><b>${i+1}. ${esc(p.name)}</b><div class='muted'>${esc(p.pos)} • ${esc(p.slot)}</div></div><span class='pill'>BSP ${Math.round(p.ros*.65+p.up*.35)}</span></div>`).join('')}</div>`}function waivers(){$('waivers').innerHTML=`<div class='card full'><h3>Waiver Comparator</h3><div class='form'><input class='wideinput' id='wn' placeholder='Free agent'><input id='wp' placeholder='POS'><input id='wr' type='number' placeholder='ROS'><input id='wu' type='number' placeholder='Upside'><button class='btn green' onclick='wcheck()'>Check</button></div><div id='wo' class='team'>Enter a player to compare against your roster floor.</div></div>`}function wcheck(){let ps=M()?.players||[],low=ps.slice().sort((a,b)=>(a.ros*.65+a.up*.35)-(b.ros*.65+b.up*.35))[0],s=Math.round((+$('wr').value||50)*.65+(+$('wu').value||50)*.35),ls=low?Math.round(low.ros*.65+low.up*.35):50;$('wo').innerHTML=`<b>${esc($('wn').value||'Free agent')}</b> BSP ${s} vs ${esc(low?.name||'roster floor')} BSP ${ls}<br><span class='${s>ls?'good':'warn'}'>${s>ls?'Upgrade candidate':'Hold / needs stronger case'}</span>`}function trade(){$('trade').innerHTML=`<div class='card full'><h3>Trade Bot</h3><div class='notice'>Use your roster ratings to identify expendable pieces. Add opponent roster data later for automatic 1-for-1 targets.</div>${(M()?.players||[]).slice().sort((a,b)=>(a.ros+a.up)-(b.ros+b.up)).map((p,i)=>`<div class='row'><div><b>${i+1}. ${esc(p.name)}</b><div class='muted'>${esc(p.pos)} • trade ammo score</div></div><span class='pill'>${Math.round((p.ros+p.up)/2)}</span></div>`).join('')}</div>`}function rankings(){let ps=L().teams.flatMap(t=>(t.players||[]).map(p=>({...p,team:t.name}))).sort((a,b)=>b.ros-a.ros);$('rankings').innerHTML=`<div class='card full'><h3>ROS Rankings</h3>${ps.map((p,i)=>`<div class='row'><div><b>${i+1}. ${esc(p.name)}</b><div class='muted'>${esc(p.pos)} • ${esc(p.team)}</div></div><span class='pill'>ROS ${p.ros}</span></div>`).join('')||'<div class="notice">No players loaded.</div>'}</div>`}function dst(){$('dst').innerHTML=`<div class='card full'><h3>D/ST Planner</h3><div class='notice'>Track your own 1–100 matchup grades to keep this version free.</div><div class='form'><input class='wideinput' id='dn' placeholder='Defense'><input id='d1' type='number' placeholder='W1'><input id='d2' type='number' placeholder='W2'><input id='d3' type='number' placeholder='W3'><button class='btn' onclick='addD()'>Add</button></div>${(L().dst||[]).sort((a,b)=>b.avg-a.avg).map((d,i)=>`<div class='row'><b>${i+1}. ${esc(d.name)}</b><span class='pill'>AVG ${d.avg}</span></div>`).join('')}</div>`}function addD(){let vals=[$('d1'),$('d2'),$('d3')].map(x=>+x.value||50);L().dst=L().dst||[];L().dst.push({name:$('dn').value||'Defense',avg:Math.round(vals.reduce((a,b)=>a+b,0)/3)});save();show('dst')}function setup(){$('setup').innerHTML=`<div class='card full'><h3>4 ESPN Leagues</h3><div class='notice'>Enter league IDs here. Never enter ESPN passwords or session cookies in this page. Private ESPN access belongs on the secure server when hosted.</div>${db.leagues.map((l,i)=>`<div class='team'><div class='form'><input class='wideinput' value='${esc(l.name)}' onchange="db.leagues[${i}].name=this.value;save()"><input value='${esc(l.espnId)}' placeholder='League ID' onchange="db.leagues[${i}].espnId=this.value;save()"><input type='number' value='${l.season}' onchange="db.leagues[${i}].season=+this.value;save()"><input value='${esc(l.myTeam)}' placeholder='Your team' onchange="db.leagues[${i}].myTeam=this.value;save()"><button class='btn' onclick='save()'>Save</button></div></div>`).join('')}</div>`}function share(){$('share').innerHTML=`<div class='grid'><div class='card wide'><h3>BigShow ↔ Billy</h3><div class='notice'>Export/import keeps both phones on the same dataset until the shared cloud database is connected.</div><div class='row'><button class='btn' onclick='exp()'>Export</button><label class='btn green'>Import<input type='file' accept='.json' hidden onchange='imp(this)'></label></div></div><div class='card'><h3>Safe by default</h3><div class='muted'>No ESPN passwords or cookies stored in the browser.</div></div></div>`}function exp(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='BSP-Fantasy-Bot-backup.json';a.click()}function imp(el){let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();alert('Imported')}catch{alert('Invalid backup')}};r.readAsText(el.files[0])}function render(){$('league').innerHTML=db.leagues.map((l,i)=>`<option value='${i}' ${i===db.active?'selected':''}>${esc(l.name)}</option>`).join('');home();roster();startsit();waivers();trade();rankings();dst();setup();share()}initTabs();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
